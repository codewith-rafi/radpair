<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-labelledby="test-title test-desc">
  <title id="test-title">Held-out sealed test retrieval</title>
  <desc id="test-desc">Grouped bar chart of Recall at 1, 5 and 10 on the sealed 3,189-pair test set. Image to text reaches 0.00878, 0.03857 and 0.05864. Text to image reaches 0.01035, 0.04265 and 0.07244. Chance Recall at 1 is 0.000314 and the five-run shuffled-pair control is 0.000439, so Recall at 1 sits about 28 and 33 times chance respectively.</desc>

  <style>
    .t { font-family: "Inter", "Segoe UI", system-ui, sans-serif; fill: #111827; }
    .lab { font-size: 13.5px; font-weight: 600; fill: #1f2937; }
    .sub { font-size: 11.5px; fill: #4b5563; }
    .num { font-size: 12px; font-weight: 700; fill: #111827; }
    .axis { stroke: #9ca3af; stroke-width: 1.2; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .i2t { fill: #4f46e5; }
    .t2i { fill: #0ea5e9; }
    .chance { stroke: #dc2626; stroke-width: 1.6; stroke-dasharray: 6 4; }
  </style>

  <rect x="0" y="0" width="1000" height="490" fill="#ffffff"/>

  <text class="t lab" x="40" y="28" font-size="15">Sealed held-out test: bidirectional retrieval</text>
  <text class="t sub" x="40" y="46">3,189 pairs, evaluated once after all choices were fixed. PEFT encoder plus disease and ITM heads.</text>

  <line class="grid" x1="90" y1="350" x2="640" y2="350"/>
  <line class="grid" x1="90" y1="278" x2="640" y2="278"/>
  <line class="grid" x1="90" y1="205" x2="640" y2="205"/>
  <line class="grid" x1="90" y1="133" x2="640" y2="133"/>
  <line class="grid" x1="90" y1="60" x2="640" y2="60"/>
  <line class="axis" x1="90" y1="60" x2="90" y2="350"/>
  <line class="axis" x1="90" y1="350" x2="640" y2="350"/>

  <text class="t sub" x="82" y="354" text-anchor="end">0.00</text>
  <text class="t sub" x="82" y="282" text-anchor="end">0.02</text>
  <text class="t sub" x="82" y="209" text-anchor="end">0.04</text>
  <text class="t sub" x="82" y="137" text-anchor="end">0.06</text>
  <text class="t sub" x="82" y="64" text-anchor="end">0.08</text>

  <line class="chance" x1="90" y1="348.9" x2="640" y2="348.9"/>
  <text class="t sub" x="98" y="342" fill="#dc2626">chance</text>

  <!-- R@1 -->
  <rect class="i2t" x="140" y="318" width="56" height="32" rx="3"/>
  <rect class="t2i" x="204" y="313" width="56" height="37" rx="3"/>
  <text class="t num" x="168" y="311" text-anchor="middle">0.0088</text>
  <text class="t num" x="232" y="306" text-anchor="middle">0.0103</text>
  <text class="t lab" x="200" y="372" text-anchor="middle">R&#64;1</text>
  <text class="t sub" x="200" y="390" text-anchor="middle">&#8776;28&#215; and &#8776;33&#215; chance</text>

  <!-- R@5 -->
  <rect class="i2t" x="320" y="210" width="56" height="140" rx="3"/>
  <rect class="t2i" x="384" y="195" width="56" height="155" rx="3"/>
  <text class="t num" x="348" y="203" text-anchor="middle">0.0386</text>
  <text class="t num" x="412" y="188" text-anchor="middle">0.0426</text>
  <text class="t lab" x="380" y="372" text-anchor="middle">R&#64;5</text>
  <text class="t sub" x="380" y="390" text-anchor="middle">7.3&#215; and 7.7&#215; R&#64;1</text>

  <!-- R@10 -->
  <rect class="i2t" x="500" y="137" width="56" height="213" rx="3"/>
  <rect class="t2i" x="564" y="87" width="56" height="263" rx="3"/>
  <text class="t num" x="528" y="130" text-anchor="middle">0.0586</text>
  <text class="t num" x="592" y="80" text-anchor="middle">0.0724</text>
  <text class="t lab" x="560" y="372" text-anchor="middle">R&#64;10</text>
  <text class="t sub" x="560" y="390" text-anchor="middle">6.7&#215; and 7.0&#215; R&#64;1</text>

  <!-- legend -->
  <rect class="i2t" x="90" y="440" width="14" height="14" rx="2"/>
  <text class="t sub" x="110" y="451">image&#8594;text</text>
  <rect class="t2i" x="200" y="440" width="14" height="14" rx="2"/>
  <text class="t sub" x="220" y="451">text&#8594;image</text>

  <!-- panel -->
  <rect x="672" y="60" width="308" height="290" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2" rx="10"/>
  <text class="t lab" x="692" y="88">Controls and scope</text>
  <line x1="692" y1="100" x2="960" y2="100" stroke="#e5e7eb" stroke-width="1.2"/>

  <text class="t sub" x="692" y="128">Exact-gallery chance R&#64;1</text>
  <text class="t num" x="960" y="128" text-anchor="end">0.000314</text>

  <text class="t sub" x="692" y="156">Shuffled-pair i2t R&#64;1</text>
  <text class="t num" x="960" y="156" text-anchor="end">0.000439</text>
  <text class="t sub" x="692" y="174" font-style="italic">mean of five runs</text>

  <line x1="692" y1="194" x2="960" y2="194" stroke="#e5e7eb" stroke-width="1.2"/>

  <text class="t lab" x="692" y="222">Reading these numbers</text>
  <text class="t sub" x="692" y="248">Retrieval is clearly above chance and</text>
  <text class="t sub" x="692" y="266">above the shuffled control, but absolute</text>
  <text class="t sub" x="692" y="284">Recall&#64;1 stays low. That is the expected</text>
  <text class="t sub" x="692" y="302">behavior for a controlled 15,000-pair</text>
  <text class="t sub" x="692" y="320">subset scored against an exact-study</text>
  <text class="t sub" x="692" y="338">gallery.</text>
</svg>