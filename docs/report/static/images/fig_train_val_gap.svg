<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="gap-title gap-desc">
  <title id="gap-title">Train versus validation retrieval gap</title>
  <desc id="gap-desc">Grouped bar chart comparing training Recall at 1 with validation Recall at 1 at the best epoch. G frozen shows train 0.0586 against validation 0.01054. PEFT shows train 0.1738 against validation 0.01910. Partial end-to-end shows train 0.7559 against validation 0.02503, a clear memorization signal. PEFT is chosen as the shared default because it reaches most of the practical gain with about 1.7 percent of the partial end-to-end trainable parameters and a smaller train-validation gap.</desc>

  <style>
    .t { font-family: "Inter", "Segoe UI", system-ui, sans-serif; fill: #111827; }
    .lab { font-size: 13.5px; font-weight: 600; fill: #1f2937; }
    .sub { font-size: 11.5px; fill: #4b5563; }
    .num { font-size: 12px; font-weight: 700; fill: #111827; }
    .axis { stroke: #9ca3af; stroke-width: 1.2; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .tr { fill: #c7d2fe; }
    .va { fill: #4338ca; }
  </style>

  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text class="t lab" x="40" y="28" font-size="15">Overfitting probe: train Recall&#64;1 versus validation Recall&#64;1</text>
  <text class="t sub" x="40" y="46">Both values are taken at each run's best validation epoch.</text>

  <line class="grid" x1="90" y1="350" x2="700" y2="350"/>
  <line class="grid" x1="90" y1="272" x2="700" y2="272"/>
  <line class="grid" x1="90" y1="194" x2="700" y2="194"/>
  <line class="grid" x1="90" y1="116" x2="700" y2="116"/>
  <line class="axis" x1="90" y1="116" x2="90" y2="350"/>
  <line class="axis" x1="90" y1="350" x2="700" y2="350"/>

  <text class="t sub" x="82" y="354" text-anchor="end">0.0</text>
  <text class="t sub" x="82" y="276" text-anchor="end">0.2</text>
  <text class="t sub" x="82" y="198" text-anchor="end">0.4</text>
  <text class="t sub" x="82" y="120" text-anchor="end">0.6</text>
  <text class="t sub" x="82" y="102" text-anchor="end">Recall&#64;1</text>

  <!-- scale: 0.8 -> 234px, so px = value * 292.5 -->
  <!-- G_frozen -->
  <rect class="tr" x="150" y="333" width="60" height="17" rx="3"/>
  <rect class="va" x="218" y="347" width="60" height="3" rx="2"/>
  <text class="t num" x="180" y="326" text-anchor="middle">0.0586</text>
  <text class="t num" x="248" y="367" text-anchor="middle">0.0105</text>
  <text class="t lab" x="214" y="392" text-anchor="middle">G_frozen</text>
  <text class="t sub" x="214" y="409" text-anchor="middle">5.6&#215; gap</text>

  <!-- PEFT -->
  <rect class="tr" x="350" y="299" width="60" height="51" rx="3"/>
  <rect class="va" x="418" y="344" width="60" height="6" rx="2"/>
  <text class="t num" x="380" y="292" text-anchor="middle">0.1738</text>
  <text class="t num" x="448" y="367" text-anchor="middle">0.0191</text>
  <text class="t lab" x="414" y="392" text-anchor="middle">PEFT (default)</text>
  <text class="t sub" x="414" y="409" text-anchor="middle">9.1&#215; gap</text>

  <!-- Partial e2e -->
  <rect class="tr" x="550" y="129" width="60" height="221" rx="3"/>
  <rect class="va" x="618" y="343" width="60" height="7" rx="2"/>
  <text class="t num" x="580" y="122" text-anchor="middle">0.7559</text>
  <text class="t num" x="648" y="367" text-anchor="middle">0.0250</text>
  <text class="t lab" x="614" y="392" text-anchor="middle">Partial e2e</text>
  <text class="t sub" x="614" y="409" text-anchor="middle">30.2&#215; gap</text>

  <!-- legend -->
  <rect class="tr" x="90" y="440" width="14" height="14" rx="2"/>
  <text class="t sub" x="110" y="451">train R&#64;1 at best epoch</text>
  <rect class="va" x="280" y="440" width="14" height="14" rx="2"/>
  <text class="t sub" x="300" y="451">validation R&#64;1</text>

  <!-- note panel -->
  <rect x="730" y="116" width="246" height="234" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2" rx="10"/>
  <text class="t lab" x="750" y="146">Why PEFT is the default</text>
  <text class="t sub" x="750" y="172">Partial e2e wins on validation,</text>
  <text class="t sub" x="750" y="190">but memorizes the training split.</text>
  <text class="t sub" x="750" y="220">PEFT gives most of the practical</text>
  <text class="t sub" x="750" y="238">alignment gain with about 1.7% of</text>
  <text class="t sub" x="750" y="256">the trainable parameters and a</text>
  <text class="t sub" x="750" y="274">smaller train-validation gap.</text>
  <line x1="750" y1="296" x2="956" y2="296" stroke="#fcd34d" stroke-width="1.2"/>
  <text class="t sub" x="750" y="320">The default is not selected</text>
  <text class="t sub" x="750" y="338">solely by highest R&#64;1.</text>
</svg>