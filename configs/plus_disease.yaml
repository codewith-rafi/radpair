# Plus disease auxiliary: freeze PEFT dual encoder; train 14-way BCE head (u_ignore).
# Always run in tmux:
#   tmux new -s plus_disease
#   activate your conda/venv
#   cd $RADPAIR_ROOT  # this repo root
#   export CUDA_VISIBLE_DEVICES=1
#   python scripts/train_plus_disease.py --config configs/plus_disease.yaml
# Detach: Ctrl-b d.
train_manifest: data/processed/plus_train_manifest.csv
val_manifest: data/processed/plus_val_manifest.csv
seed: 42
text_encoder: models/Bio_ClinicalBERT
image_cache_root: chexpert_plus_subset/images_chambon
dicom_preprocess: chambon_appendix_a
u_policy: ignore

init_ckpt: experiments/plus_g_peft_001/checkpoint.pt
freeze_encoder: true

max_text_length: 256
embed_dim: 256
n_labels: 14

# PEFT architecture must match init_ckpt
freeze_image: true
freeze_text: true
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.1
lora_modules:
  - query
  - value

batch_size: 32
max_epochs: 40
early_stop_patience: 8
lr: 0.001
weight_decay: 0.01
num_workers: 8
amp: true
decision_threshold: 0.5

expected_n_train: 10293
expected_n_val: 1518

experiment_dir: experiments/plus_disease_bce_001
