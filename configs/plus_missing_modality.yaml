# Plus missing-modality validation.
# Same DiseaseHead; image_only vs text_only vs image_baseline. # Always run in tmux:
#   tmux new -s plus_missing
#   activate your conda/venv
#   cd $RADPAIR_ROOT  # this repo root
#   export CUDA_VISIBLE_DEVICES=1
#   python scripts/eval_plus_missing_modality.py --config configs/plus_missing_modality.yaml
# Detach: Ctrl-b d.
val_manifest: data/processed/plus_val_manifest.csv
seed: 42
text_encoder: models/Bio_ClinicalBERT
image_cache_root: chexpert_plus_subset/images_chambon
dicom_preprocess: chambon_appendix_a
u_policy: ignore

peft_ckpt: experiments/plus_g_peft_001/checkpoint.pt
disease_ckpt: experiments/plus_disease_bce_001/checkpoint.pt
freeze_encoder: true

max_text_length: 256
embed_dim: 256
n_labels: 14

freeze_image: true
freeze_text: true
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.1
lora_modules:
  - query
  - value

batch_size: 32
num_workers: 8
amp: true
decision_threshold: 0.5

expected_n_val: 1518

experiment_dir: experiments/plus_missing_modality_001
