# Plus G_PEFT ablation A1: Findings-only text (section_findings).
# Same LoRA/τ/bs/seed as plus_g_peft.yaml; only report_text changes.
# Subset: rows with non-empty section_findings (many Plus studies are Impression-only).
# Always run in tmux:
#   tmux new -s plus_a1
#   activate your conda/venv
#   cd $RADPAIR_ROOT  # this repo root
#   export CUDA_VISIBLE_DEVICES=1
#   python scripts/train_plus_g_peft.py --config configs/plus_g_peft_a1_findings.yaml
# Detach: Ctrl-b d.
train_manifest: data/processed/plus_train_findings_only_manifest.csv
val_manifest: data/processed/plus_val_findings_only_manifest.csv
seed: 42
text_encoder: models/Bio_ClinicalBERT
image_cache_root: chexpert_plus_subset/images_chambon
dicom_preprocess: chambon_appendix_a
u_policy: ignore

max_text_length: 256
embed_dim: 256
tau: 0.07
learnable_tau: false
freeze_image: true
freeze_text: true

lora_rank: 8
lora_alpha: 16
lora_dropout: 0.1
lora_targets: text_only
lora_modules:
  - query
  - value

batch_size: 32
max_epochs: 40
early_stop_patience: 8
lr: 0.001
lora_lr: 0.0001
weight_decay: 0.01
num_workers: 8
train_eval_n: 512
n_shuffle: 5
amp: true

expected_n_train: 2585
expected_n_val: 364

experiment_dir: experiments/plus_g_peft_a1_findings_001
ablation: A1_findings_only
