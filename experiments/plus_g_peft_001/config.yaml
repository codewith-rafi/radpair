# Plus G_PEFT: freeze ResNet; LoRA on BioClinicalBERT (query+value); train LoRA + projections.
# Same recipe as plus_g1_freezeproj_003 (fair adaptation comparison).
# Early stop on val i2t R@1. Chambon JPG cache required.
# Always run in tmux:
#   tmux new -s plus_peft
#   activate your conda/venv
#   cd $RADPAIR_ROOT
#   export CUDA_VISIBLE_DEVICES=1
#   python scripts/train_plus_g_peft.py --config configs/plus_g_peft.yaml
# Detach: Ctrl-b d.
train_manifest: data/processed/plus_train_manifest.csv
val_manifest: data/processed/plus_val_manifest.csv
seed: 42
text_encoder: models/Bio_ClinicalBERT
image_cache_root: chexpert_plus_subset/images_chambon
dicom_preprocess: chambon_appendix_a
u_policy: ignore

max_text_length: 256
embed_dim: 256
tau: 0.07
learnable_tau: false
freeze_image: true
freeze_text: true

lora_rank: 8
lora_alpha: 16
lora_dropout: 0.1
lora_targets: text_only
lora_modules:
  - query
  - value

batch_size: 32
max_epochs: 40
early_stop_patience: 8
lr: 0.001
lora_lr: 0.0001
weight_decay: 0.01
num_workers: 8
train_eval_n: 512
n_shuffle: 5
amp: true

expected_n_train: 10293
expected_n_val: 1518

experiment_dir: experiments/plus_g_peft_001
