# Plus ITM: freeze PEFT dual encoder; binary match head (concat MLP).
# Always run in tmux:
#   tmux new -s plus_itm
#   export CUDA_VISIBLE_DEVICES=1
#   cd $RADPAIR_ROOT
#   python scripts/train_plus_itm.py --config configs/plus_itm.yaml
# Detach: Ctrl-b d.
train_manifest: data/processed/plus_train_manifest.csv
val_manifest: data/processed/plus_val_manifest.csv
seed: 42
text_encoder: models/Bio_ClinicalBERT
image_cache_root: chexpert_plus_subset/images_chambon
dicom_preprocess: chambon_appendix_a
u_policy: ignore

init_ckpt: experiments/plus_g_peft_001/checkpoint.pt
freeze_encoder: true

max_text_length: 256
embed_dim: 256
itm_hidden_dim: 128

# PEFT architecture must match init_ckpt
freeze_image: true
freeze_text: true
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.1
lora_modules:
  - query
  - value

batch_size: 32
max_epochs: 40
early_stop_patience: 8
early_stop_min_delta: 0.001
lr: 0.001
weight_decay: 0.01
# Fewer workers: may share GPU1/CPU with plus_disease
num_workers: 4
amp: true
decision_threshold: 0.5

expected_n_train: 10293
expected_n_val: 1518

experiment_dir: experiments/plus_itm_001
